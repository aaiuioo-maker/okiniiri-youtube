<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pk:#ff7eb3;--pk2:#ffb347;--bg:#0f0a14;--line2:rgba(255,126,179,.07);}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:'Inter',sans-serif;color:#fff}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(255,255,255,.015) 4px,rgba(255,255,255,.015) 5px);pointer-events:none;z-index:9999;}
#opening{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:500;cursor:pointer;overflow:hidden;}
.op-grid{position:absolute;inset:0;background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);background-size:60px 60px;}
.op-vignette{position:absolute;inset:0;background:radial-gradient(ellipse 72% 72% at 50% 50%,transparent 25%,rgba(15,10,20,.9) 100%);pointer-events:none;}
.op-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);width:500px;height:500px;background:radial-gradient(ellipse,rgba(255,126,179,.15) 0%,transparent 65%);pointer-events:none;}
.mark{position:absolute;width:28px;height:28px;opacity:.4}
.mark-tl{top:24px;left:24px;border-top:1px solid var(--pk);border-left:1px solid var(--pk)}
.mark-tr{top:24px;right:24px;border-top:1px solid var(--pk);border-right:1px solid var(--pk)}
.mark-bl{bottom:24px;left:24px;border-bottom:1px solid var(--pk);border-left:1px solid var(--pk)}
.mark-br{bottom:24px;right:24px;border-bottom:1px solid var(--pk);border-right:1px solid var(--pk)}
.op-eyebrow{font-size:.6rem;letter-spacing:.35em;text-transform:uppercase;color:var(--pk);opacity:0;animation:fadeIn .5s 1.0s forwards;position:relative;z-index:1;margin-bottom:1.2rem;}
.op-title-wrap{position:relative;z-index:1;text-align:center}
.op-title{font-family:'Zen Maru Gothic',sans-serif;font-size:clamp(2.4rem,12vw,5.6rem);font-weight:700;letter-spacing:.06em;color:#fff;line-height:1.15;opacity:0;animation:titleIn .9s .3s cubic-bezier(.16,1,.3,1) forwards;position:relative;display:inline-block;}
.op-title .yt{color:var(--pk);}
.op-title::after{content:'';position:absolute;bottom:-6px;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--pk),var(--pk2),transparent);opacity:0;animation:fadeIn .6s 1s forwards;}
.op-tagline{font-size:.65rem;letter-spacing:.18em;color:rgba(255,255,255,.35);opacity:0;animation:fadeIn .5s 1.4s forwards;position:relative;z-index:1;margin-top:1.2rem;}
.op-prompt{font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--pk);opacity:0;animation:blink 1.4s 2.0s infinite,fadeIn .4s 2.0s forwards;position:relative;z-index:1;margin-top:2.4rem;}
#main{display:none;height:100vh;height:100dvh;flex-direction:column;align-items:center;justify-content:flex-start;padding:3rem 1.5rem 4rem;gap:1.4rem;position:relative;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#main>.m-eyebrow{margin-top:auto}
#main>#backupBar{margin-bottom:auto}
button,a,input,textarea{touch-action:manipulation}
.main-bg-glow{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:560px;height:560px;background:radial-gradient(ellipse,rgba(255,126,179,.08) 0%,transparent 70%);pointer-events:none;}
.m-corner{position:fixed;width:24px;height:24px;opacity:.2}
.m-tl{top:16px;left:16px;border-top:1px solid var(--pk);border-left:1px solid var(--pk)}
.m-br{bottom:16px;right:16px;border-bottom:1px solid var(--pk);border-right:1px solid var(--pk)}
.m-eyebrow{font-size:.55rem;letter-spacing:.35em;text-transform:uppercase;color:rgba(255,126,179,.5)}
.m-title{font-family:'Zen Maru Gothic',sans-serif;font-size:clamp(1.8rem,8vw,3.2rem);font-weight:700;letter-spacing:.05em;color:#fff;text-align:center;line-height:1.2;}
.m-title span{color:var(--pk)}
.m-rule{width:160px;height:1px;background:linear-gradient(90deg,transparent,var(--pk),var(--pk2),transparent);opacity:.45;}
.vlist{display:flex;flex-direction:column;gap:.45rem;width:100%;max-width:460px;max-height:56vh;overflow-y:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:rgba(255,126,179,.25) transparent;}
.vlist::-webkit-scrollbar{width:2px}
.vlist::-webkit-scrollbar-thumb{background:rgba(255,126,179,.3);border-radius:2px}
.vrow{display:flex;align-items:center;gap:.9rem;padding:.8rem 1.1rem;background:rgba(255,126,179,.03);border:1px solid rgba(255,126,179,.12);border-left:2px solid rgba(255,126,179,.4);color:#fff;font-family:'Inter',sans-serif;font-size:.88rem;font-weight:300;letter-spacing:.03em;text-align:left;cursor:pointer;width:100%;transition:background .2s,border-color .2s,padding-left .2s;position:relative;overflow:hidden;}
.vrow::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,126,179,.06),transparent);opacity:0;transition:opacity .2s;}
.vrow:hover{background:rgba(255,126,179,.08);border-color:rgba(255,126,179,.55);padding-left:1.5rem}
.vrow:hover::before{opacity:1}
.vrow:hover .vrow-num{color:var(--pk)}
.vrow:hover .vrow-arrow{color:var(--pk);transform:translateX(3px)}
.vrow-num{font-size:.52rem;letter-spacing:.12em;color:rgba(255,126,179,.45);font-weight:400;min-width:18px;flex-shrink:0;transition:color .2s;}
.vrow-label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vrow-arrow{font-size:.72rem;color:rgba(255,255,255,.22);transition:color .2s,transform .2s;flex-shrink:0;}
.yticon{width:13px;height:13px;flex-shrink:0;opacity:.4}
.ytpath{fill:#fff}
.m-foot{font-size:.48rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.15);margin-top:.4rem}
.genre-head{font-size:.55rem;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,126,179,.5);padding:.5rem 0 .3rem 1.1rem;border-bottom:1px solid rgba(255,126,179,.13);width:100%;margin-top:.4rem;}
#mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(5px);z-index:600;align-items:center;justify-content:center;padding:1.5rem;}
#mbg.open{display:flex}
#mbox{background:#16091d;border:1px solid rgba(255,126,179,.2);border-top:1px solid rgba(255,126,179,.5);width:100%;max-width:420px;padding:2rem;position:relative;animation:fadeUp .3s both;border-radius:2px;}
#mbox::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--pk),var(--pk2),transparent);}
.mclose{position:absolute;top:.9rem;right:.9rem;background:none;border:none;color:rgba(255,255,255,.3);font-size:1rem;cursor:pointer;transition:color .2s;line-height:1;}
.mclose:hover{color:var(--pk)}
.mnum{font-size:.52rem;letter-spacing:.2em;color:rgba(255,126,179,.5);margin-bottom:.5rem;font-weight:400}
.mtitle{font-family:'Zen Maru Gothic',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:.03em;color:#fff;margin-bottom:1rem;line-height:1.3;}
.mrule{width:100%;height:1px;background:rgba(255,126,179,.15);margin-bottom:1rem}
.mdesc{font-size:.83rem;color:rgba(255,255,255,.55);line-height:1.9;margin-bottom:1.8rem;font-weight:300}
.mplay{display:flex;align-items:center;justify-content:center;gap:.7rem;width:100%;padding:.9rem;background:transparent;border:1px solid rgba(255,126,179,.45);color:var(--pk);font-family:'Inter',sans-serif;font-size:.75rem;font-weight:400;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .2s,border-color .2s,color .2s;border-radius:1px;}
.mplay:hover{background:rgba(255,126,179,.12);border-color:var(--pk);color:#fff}
/* プレーヤー */
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden;margin-bottom:1rem;cursor:pointer;}
.player img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85;transition:opacity .2s}
.player:hover img{opacity:1}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .pbtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--pk),var(--pk2));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(255,126,179,.55);pointer-events:none}
.player .pbtn::after{content:'';border-left:22px solid #fff;border-top:14px solid transparent;border-bottom:14px solid transparent;margin-left:6px}
.player .noid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:.8rem}
#mbox{max-height:92vh;overflow-y:auto}
.mdesc{margin-bottom:1.2rem}
.mdel{display:none;width:100%;margin-top:.7rem;padding:.6rem;background:none;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.4);font-size:.72rem;cursor:pointer;border-radius:2px}
.mdel:hover{border-color:#ff6b6b;color:#ff6b6b}
/* シート共通 */
.sheet-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(5px);z-index:700;align-items:center;justify-content:center;padding:1.2rem;}
.sheet-bg.open{display:flex}
#cfBg{z-index:800}
.sheet{background:#16091d;border:1px solid rgba(255,126,179,.3);width:100%;max-width:420px;max-height:92vh;overflow-y:auto;padding:1.8rem 1.5rem;position:relative;border-radius:4px;animation:fadeUp .3s both;}
.sheet::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--pk),var(--pk2),transparent);}
.sheet.small{max-width:340px;text-align:center}
.add-title{font-family:'Zen Maru Gothic',sans-serif;font-size:1.1rem;font-weight:700;color:#fff;margin-bottom:1.2rem;letter-spacing:.05em;}
.add-label{font-size:.62rem;letter-spacing:.2em;color:rgba(255,126,179,.7);margin-bottom:.3rem;display:block;}
.add-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,126,179,.25);color:#fff;font-family:'Inter',sans-serif;font-size:16px;padding:.65rem .9rem;border-radius:3px;outline:none;margin-bottom:1rem;transition:border-color .2s;}
.add-input:focus{border-color:rgba(255,126,179,.7);}
.add-input::placeholder{color:rgba(255,255,255,.25);}
.add-thumb{display:none;width:100%;aspect-ratio:16/9;border-radius:3px;overflow:hidden;margin:-.4rem 0 1rem;background:#000}
.add-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.add-err{color:#ff8a8a;font-size:.78rem;min-height:1em;margin-bottom:.5rem}
.add-row{display:flex;gap:.7rem;margin-top:.3rem;}
.add-save{flex:1;padding:.85rem;background:linear-gradient(90deg,var(--pk),var(--pk2));border:none;color:#fff;font-family:'Zen Maru Gothic',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;border-radius:3px;transition:opacity .2s;}
.add-save:hover{opacity:.85}
.add-cancel{padding:.85rem 1.2rem;background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.65);font-family:'Zen Maru Gothic',sans-serif;font-size:.85rem;cursor:pointer;border-radius:3px;transition:border-color .2s;}
.add-cancel:hover{border-color:rgba(255,255,255,.45);color:#fff}
.wide{width:100%;display:block;margin:.4rem 0 .8rem}
.sheet-note{font-size:.78rem;color:rgba(255,255,255,.55);line-height:1.7;margin-bottom:.6rem}
.bk-text{width:100%;height:110px;background:rgba(255,255,255,.04);border:1px solid rgba(255,126,179,.2);color:rgba(255,255,255,.75);font-family:monospace;font-size:12px;padding:.6rem;border-radius:3px;resize:vertical;outline:none}
.cf-msg{color:#fff;font-size:.92rem;line-height:1.7;margin-bottom:1.2rem;white-space:pre-line}
/* 追加ボタン */
#addBtn{position:fixed;bottom:calc(2.2rem + env(safe-area-inset-bottom));right:1.3rem;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--pk),var(--pk2));border:none;color:#fff;font-size:1.7rem;line-height:1;cursor:pointer;box-shadow:0 4px 20px rgba(255,126,179,.45);z-index:400;transition:transform .2s;display:none;align-items:center;justify-content:center}
#addBtn:active{transform:scale(.92)}
/* バックアップバー */
#backupBar{display:flex;flex-direction:row;justify-content:center;gap:.7rem;width:100%;max-width:460px;}
.add-status{font-size:.75rem;color:rgba(255,179,71,.85);min-height:1.1em;margin:-.6rem 0 .8rem}
.bk-btn{padding:.75rem 1.3rem;min-height:44px;background:rgba(22,9,29,.92);border:1px solid rgba(255,126,179,.35);color:rgba(255,255,255,.7);font-family:'Zen Maru Gothic',sans-serif;font-size:.72rem;cursor:pointer;border-radius:20px;transition:border-color .2s,color .2s;white-space:nowrap;}
.bk-btn:hover{border-color:rgba(255,126,179,.8);color:#fff}
#main{padding-bottom:calc(7rem + env(safe-area-inset-bottom))}
/* トースト */
#toast{position:fixed;left:50%;bottom:calc(6rem + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(255,126,179,.95);color:#fff;font-family:'Zen Maru Gothic',sans-serif;font-size:.85rem;font-weight:700;padding:.6rem 1.2rem;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:900;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fadeIn{to{opacity:1}}
@keyframes titleIn{from{opacity:0;transform:scale(1.04) translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fi{animation:fadeUp .55s both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
.d4{animation-delay:.32s}.d5{animation-delay:.4s}.d6{animation-delay:.48s}.d7{animation-delay:.56s}
.add-select{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,126,179,.25);color:#fff;font-family:'Zen Maru Gothic',sans-serif;font-size:16px;padding:.65rem 2rem .65rem .9rem;border-radius:3px;outline:none;margin-bottom:1rem;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,rgba(255,126,179,.8) 50%),linear-gradient(135deg,rgba(255,126,179,.8) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.add-select option{background:#16091d;color:#fff}
.mgenre-wrap{display:none;margin-top:.9rem}
.vrow-new{font-size:.7rem;color:var(--pk2);margin-left:.3rem;flex-shrink:0}
/* === Claude Code のキャラクター（画面左上） === */
.cc-wrap { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 40px; z-index: 2; width: 62px; height: 40px; flex-shrink: 0; display: flex; justify-content: center; }
.cc-mascot { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; padding-top: 4px; }
.cc-mascot svg { width: 36px; height: 27px; shape-rendering: crispEdges; overflow: visible; transform-origin: center; }
/* 歩く・立ち止まる・手足の動きは、下のスクリプト（ccMascot）で1コマずつ動かしている */
.cc-mascot .cc-label { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 7px; letter-spacing: 0.05em; color: #d97757; opacity: 0.8; white-space: nowrap; }
.cc-body { fill: #d97757; }
.cc-eye { fill: #1a1612; transform-box: fill-box; transform-origin: center; }
/* ときどきまばたき */
.cc-eye { animation: cc-blink 4s infinite; }
@keyframes cc-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
</style>
</head>
<body>

<div id="opening">
  <div class="op-grid"></div>
  <div class="op-vignette"></div>
  <div class="op-glow"></div>
  <div class="mark mark-tl"></div>
  <div class="mark mark-tr"></div>
  <div class="mark mark-bl"></div>
  <div class="mark mark-br"></div>
  <p class="op-eyebrow">✦ my favorites ✦</p>
  <div class="op-title-wrap">
    <h1 class="op-title">お気に入り<span class="yt">YouTube</span></h1>
  </div>
  <p class="op-tagline">すみちゃんのお気に入りコレクション</p>
  <p class="op-prompt">▶ tap to enter</p>
</div>

<div id="main">
  <div class="main-bg-glow"></div>
  <div class="m-corner m-tl"></div>
  <div class="m-corner m-br"></div>
  <div class="cc-wrap">

      <!-- 1マス＝1ドットのドット絵（横12×縦8マス：体6段＋足2段） -->
      <svg viewBox="0 -1 12 9" aria-hidden="true">
        <!-- 足（左から順に4本）。上げるときは高さを1マスにする -->
        <rect class="cc-body cc-leg" x="2" y="6" width="1" height="2"/>
        <rect class="cc-body cc-leg" x="4" y="6" width="1" height="2"/>
        <rect class="cc-body cc-leg" x="7" y="6" width="1" height="2"/>
        <rect class="cc-body cc-leg" x="9" y="6" width="1" height="2"/>
        <g class="cc-hop">
          <rect class="cc-body" x="2" y="0" width="8" height="6"/>
          <rect class="cc-body cc-arm-l" x="0" y="2" width="2" height="2"/>
          <rect class="cc-body cc-arm-r" x="10" y="2" width="2" height="2"/>
          <rect class="cc-eye" x="3" y="1" width="1" height="1"/>
          <rect class="cc-eye" x="8" y="1" width="1" height="1"/>
        </g>
      </svg>
      <span class="cc-label">Claude Code</span>
    </a>
  </div>
  <p class="m-eyebrow fi d1">✦ my favorites ✦</p>
  <h1 class="m-title fi d2">お気に入り<span>YouTube</span></h1>
  <div class="m-rule fi d3"></div>
  <div class="vlist" id="vlist"></div>
  <p class="m-foot fi d7">sumichannel — お気に入りコレクション</p>
  <!-- バックアップ・復元バー -->
  <div id="backupBar">

    <button class="bk-btn" onclick="openRestore()">📂 復元</button>
  </div>
</div>

<div id="mbg" onclick="closeBg(event)">
  <div id="mbox">
    <button class="mclose" onclick="closeModal()">✕</button>
    <p class="mnum" id="mnum"></p>
    <h2 class="mtitle" id="mtitle"></h2>
    <div class="player" id="player"></div>
    <p class="mdesc" id="mdesc"></p>

  </div>
</div>

<!-- お気に入り追加ボタン -->
<button id="addBtn" onclick="openAdd()" aria-label="お気に入りを追加">＋</button>



<!-- お気に入り追加フォーム -->
<div class="sheet-bg" id="addBg" onclick="bgClose(event,'addBg')">
  <div class="sheet">
    <button class="mclose" onclick="closeSheet('addBg')">✕</button>
    <p class="add-title">✦ お気に入りを追加</p>
    <label class="add-label">YouTube URL</label>
    <input class="add-input" id="addUrlInput" type="url" inputmode="url" placeholder="https://youtu.be/..." oninput="previewAdd()">
    <div class="add-thumb" id="addThumb"></div>
    <p class="add-status" id="addStatus"></p>
    <label class="add-label">タイトル</label>
    <input class="add-input" id="addTitleInput" type="text" placeholder="URLを入れると自動で入ります">
    <label class="add-label">メモ（省略可）</label>
    <input class="add-input" id="addDescInput" type="text" placeholder="ひとことメモ">
    <label class="add-label">ジャンル</label>
    <select class="add-select" id="addGenreInput" onchange="genreTouched=true"></select>
    <p class="add-err" id="addErr"></p>
    <div class="add-row">
      <button class="add-cancel" onclick="closeSheet('addBg')">キャンセル</button>
      <button class="add-save" onclick="saveAdd()">追加する</button>
    </div>
  </div>
</div>

<!-- バックアップ -->
<div class="sheet-bg" id="bkBg" onclick="bgClose(event,'bkBg')">
  <div class="sheet">
    <button class="mclose" onclick="closeSheet('bkBg')">✕</button>
    <p class="add-title">💾 バックアップ</p>
    <p class="sheet-note" id="bkNote"></p>
    <button class="add-save wide" id="bkFileBtn" onclick="backupFile()">ファイルに保存する</button>
    <p class="sheet-note">または、下の文字をコピーしてメモ帳やLINEのKeepなどに貼って保管してください。</p>
    <textarea class="bk-text" id="bkText" readonly></textarea>
    <button class="add-cancel wide" onclick="copyBackup()">📋 コピーする</button>
  </div>
</div>

<!-- 復元 -->
<div class="sheet-bg" id="rsBg" onclick="bgClose(event,'rsBg')">
  <div class="sheet">
    <button class="mclose" onclick="closeSheet('rsBg')">✕</button>
    <p class="add-title">📂 復元</p>
    <button class="add-cancel wide" onclick="document.getElementById('restoreFile').click()">バックアップファイルを選ぶ</button>
    <input type="file" id="restoreFile" accept=".json,application/json,text/plain" style="display:none" onchange="restoreFromFile(event)">
    <p class="sheet-note">または、コピーしておいた文字をここに貼り付けてください。</p>
    <textarea class="bk-text" id="rsText" placeholder="ここに貼り付け"></textarea>
    <p class="add-err" id="rsErr"></p>
    <button class="add-save wide" onclick="restoreFromText()">復元する</button>
  </div>
</div>

<!-- 確認ダイアログ -->
<div class="sheet-bg" id="cfBg">
  <div class="sheet small">
    <p class="cf-msg" id="cfMsg"></p>
    <div class="add-row">

    </div>
  </div>
</div>

function ytId(url){

// ---------- 保存（端末のブラウザ + アプリ上ではクラウド） ----------
var cloud=null; // {ref}
function saveLocal(){try{localStorage.setItem(STORE_KEY,JSON.stringify(extra));}catch(e){}}
function loadLocal(){try{var a=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}}
var saving=Promise.resolve();
function persist(){
  saveLocal();
  if(cloud){
    var data={items:extra,updated:new Date().toISOString()};
    saving=saving.then(function(){return cloud.ref.set(data);}).catch(function(){});
  }
}
function connectCloud(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return null;
    return user.id().then(function(uid){
      if(!uid)return null;
      var ref=db.collection('data/users/'+uid).doc('favorites');
      return ref.get().then(function(snap){
        cloud={ref:ref};
        var d=snap.exists?snap.data():null;
        if(d&&Array.isArray(d.items)){
          // クラウドとこの端末の分をまとめる
          var seen={};extra.forEach(function(v){seen[v.url]=1;});
          var merged=extra.slice();var added=false;
          d.items.forEach(function(v){if(v&&v.url&&!seen[v.url]){merged.push(v);seen[v.url]=1;added=true;}});
          if(added){extra=renumber(merged);rebuild();}
          if(merged.length!==d.items.length)persist();else saveLocal();
        }else if(extra.length){persist();}
      });
    });
  }).catch(function(){});
}

function renumber(arr){
  return arr.map(function(v,i){var g=String(v.genre||'');if(g&&!BASE_GENRES.some(function(x){return x.label===g;}))g='';return{num:String(BASE_COUNT+i+1).padStart(2,'0'),title:String(v.title||'無題'),url:String(v.url||''),desc:String(v.desc||''),genre:g};});
}

function rebuild(){
  vids.length=BASE_COUNT;
  extra.forEach(function(v){vids.push(v);});
  vidMap={};vids.forEach(function(v,i){vidMap[v.num]=i;});
  // ジャンルを作り直す（追加した動画は選んだジャンルの先頭に）
  genres=BASE_GENRES.map(function(g){return{label:g.label,nums:g.nums.slice()};});
  var others=[];
  extra.slice().reverse().forEach(function(v){
    var g=null;for(var k=0;k<genres.length;k++){if(genres[k].label===v.genre){g=genres[k];break;}}
    if(g)g.nums.unshift(v.num);else others.unshift(v.num);
  });
  if(others.length)genres.unshift({label:ADD_LABEL,nums:others});
  renderList();
}

// タイトル取得（noembed → JSONP → YouTube oEmbed の順に試す）
function getJSON(url){
  return fetch(url).then(function(r){if(!r.ok)throw new Error('http');return r.json();});
}
function getJSONP(url){
  return new Promise(function(res,rej){
    var cb='__yt'+Date.now()+Math.floor(Math.random()*1e4);
    var s=document.createElement('script');
    var tm=setTimeout(function(){cleanup();rej(new Error('timeout'));},6000);
    function cleanup(){clearTimeout(tm);try{delete window[cb];}catch(e){window[cb]=undefined;}s.remove();}
    window[cb]=function(d){cleanup();res(d);};
    s.onerror=function(){cleanup();rej(new Error('jsonp'));};
    s.src=url+(url.indexOf('?')<0?'?':'&')+'callback='+cb;
    document.head.appendChild(s);
  });
}
function okData(d){if(d&&d.title&&!d.error)return d;throw new Error('nodata');}
function fetchTitle(id){
  var watch='https://www.youtube.com/watch?v='+id;
  var ne='https://noembed.com/embed?url='+encodeURIComponent(watch);
  var yt='https://www.youtube.com/oembed?format=json&url='+encodeURIComponent(watch);
  return getJSON(ne).then(okData)
    .catch(function(){return getJSONP(ne).then(okData);})
    .catch(function(){return getJSON(yt).then(okData);});
}

function previewAdd(){
  var url=document.getElementById('addUrlInput').value.trim();
  var id=ytId(url);
  var th=document.getElementById('addThumb');
  var st=document.getElementById('addStatus');
  document.getElementById('addErr').textContent='';
  if(!id){th.style.display='none';st.textContent='';lookupId=null;lookupPromise=null;return;}
  th.innerHTML='<img alt="" src="https://i.ytimg.com/vi/'+id+'/mqdefault.jpg">';th.style.display='block';
  if(id===lookupId)return;
  lookupId=id;
  clearTimeout(lookupTimer);
  st.textContent='タイトルを読み込み中…';
  lookupTimer=setTimeout(function(){
    var myId=id;
    lookupPromise=fetchTitle(myId).then(function(d){
      if(lookupId!==myId)return;
      var tEl=document.getElementById('addTitleInput'),dEl=document.getElementById('addDescInput');
      var title=String(d.title).trim();
      var desc=d.author_name?('チャンネル：'+String(d.author_name).trim()):'';
      // 手で書き換えていなければ自動で入れる
      if(!tEl.value.trim()||tEl.value===autoTitle){tEl.value=title;autoTitle=title;}
      if(desc&&(!dEl.value.trim()||dEl.value===autoDesc)){dEl.value=desc;autoDesc=desc;}
      if(!genreTouched){var gg=guessGenre(tEl.value+' '+dEl.value);if(gg)document.getElementById('addGenreInput').value=gg;}
      st.textContent='✓ タイトルを読み込みました';
    }).catch(function(){
      if(lookupId!==myId)return;
      st.textContent='タイトルを読み込めませんでした。手で入力してください';
    });
  },350);
}

function saveAdd(){
  var url=document.getElementById('addUrlInput').value.trim();
  var err=document.getElementById('addErr');
  if(!url){err.textContent='URLを入れてください';return;}
  var id=ytId(url);
  if(!id){err.textContent='YouTubeのURLではないようです';return;}
  var dup=allVids().some(function(v){return ytId(v.url)===id;});
  if(dup){err.textContent='この動画はもう入っています';return;}
  // タイトル読み込み中なら終わるのを待ってから保存
  var tEl=document.getElementById('addTitleInput');
  if(!tEl.value.trim()&&lookupId===id){
    var wait=lookupPromise||new Promise(function(r){setTimeout(r,800);}).then(function(){return lookupPromise;});
    document.getElementById('addStatus').textContent='タイトルを読み込み中…';
    Promise.resolve(wait).catch(function(){}).then(function(){finishAdd(url);});
    return;
  }
  finishAdd(url);
}
function finishAdd(url){
  var title=document.getElementById('addTitleInput').value.trim();
  var desc=document.getElementById('addDescInput').value.trim();
  if(!title)title='お気に入り動画 '+(extra.length+1);
  var genre=document.getElementById('addGenreInput').value;
  if(!genre&&!genreTouched)genre=guessGenre(title+' '+desc);
  extra.push({title:title,url:url,desc:desc,genre:genre});
  extra=renumber(extra);
  rebuild();persist();
  closeSheet('addBg');
  list.scrollTop=0;
  toast(shortName(genre)+' に追加しました ♡');
}

function backupFile(){
  var name='okiniiri_backup_'+new Date().toISOString().slice(0,10)+'.json';
  var json=backupJSON();
  if(dl){
    dl.save({filename:name,data:json}).then(function(r){if(r&&r.status==='saved')toast('保存しました');}).catch(function(){toast('保存できませんでした。コピーを使ってください');});
    return;
  }
  try{
    var blob=new Blob([json],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
    toast('保存しました');
  }catch(e){toast('保存できませんでした。コピーを使ってください');}
}

    navigator.clipboard.writeText(ta.value).then(done,function(){ta.select();try{document.execCommand('copy');done();}catch(e){toast('長押しでコピーしてください');}});
  }else{ta.select();try{document.execCommand('copy');done();}catch(e){toast('長押しでコピーしてください');}}
}

function parseBackup(text){
  var d=JSON.parse(text);
  var arr=Array.isArray(d)?d:(d&&Array.isArray(d.extra)?d.extra:null);
  if(!arr)throw new Error('format');
  return arr.filter(function(v){return v&&v.url;});
}
function applyRestore(text){
  var err=document.getElementById('rsErr');
  var arr;
  try{arr=parseBackup(text);}catch(e){err.textContent='バックアップの形式が正しくありません';return;}
  confirmBox('お気に入り '+arr.length+' 件を復元します。\n今の追加分は置きかわります。よろしいですか？',function(){
    extra=renumber(arr);
    rebuild();persist();
    closeSheet('rsBg');
    toast(arr.length+' 件を復元しました');
  });
}

function restoreFromFile(e){

var AC=window.AudioContext||window.webkitAudioContext,ctx=null,bgmMaster=null;
// 動画再生時はBGMを止める
function fadeBGM(){if(!bgmMaster||!ctx)return;var t=ctx.currentTime;try{bgmMaster.gain.cancelScheduledValues(t);bgmMaster.gain.setValueAtTime(bgmMaster.gain.value,t);bgmMaster.gain.linearRampToValueAtTime(0,t+0.6);}catch(e){}}

// キラキラピアノBGM — 明るくお気に入り感のある音楽
function startBGM(){
  if(bgmOn)return;bgmOn=true;ctx=new AC();
  var master=ctx.createGain();master.gain.value=0.15;master.connect(ctx.destination);bgmMaster=master;

  // コンプレッサー
  var comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;comp.connect(master);

  // きらきらリバーブ（短め、明るめ）
  var rLen=ctx.sampleRate*1.4,rBuf=ctx.createBuffer(2,rLen,ctx.sampleRate);
  for(var c=0;c<2;c++){var d=rBuf.getChannelData(c);for(var i=0;i<rLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rLen,3.5)}
  var conv=ctx.createConvolver();conv.buffer=rBuf;
  var rg=ctx.createGain();rg.gain.value=0.28;conv.connect(rg);rg.connect(comp);

  // ハイシェルフ（明るさUP）
  var hsf=ctx.createBiquadFilter();hsf.type='highshelf';hsf.frequency.value=3000;hsf.gain.value=5;
  hsf.connect(comp);hsf.connect(conv);

  // テンポ 100BPM、C major スケール
  var bpm=100,s=60/bpm,t=ctx.currentTime+0.2;

  // ピアノ音（sine+triangle ミックスで丸みある音色）
  function piano(freq,when,dur,vol){
    vol=vol||0.18;
    // sine（基音）
    var o1=ctx.createOscillator(),g1=ctx.createGain();
    o1.type='sine';o1.frequency.value=freq;
    g1.gain.setValueAtTime(0,when);
    g1.gain.linearRampToValueAtTime(vol,when+0.012);
    g1.gain.setValueAtTime(vol*0.6,when+0.05);
    g1.gain.exponentialRampToValueAtTime(0.001,when+dur);
    o1.connect(g1);g1.connect(hsf);o1.start(when);o1.stop(when+dur+0.05);
    // triangle（倍音）
    var o2=ctx.createOscillator(),g2=ctx.createGain();
    o2.type='triangle';o2.frequency.value=freq*2;
    g2.gain.setValueAtTime(0,when);
    g2.gain.linearRampToValueAtTime(vol*0.25,when+0.012);
    g2.gain.exponentialRampToValueAtTime(0.001,when+dur*0.6);
    o2.connect(g2);g2.connect(hsf);o2.start(when);o2.stop(when+dur);
  }

  // キラキラ高音アルペジオ（グロッケン風）
  function bell(freq,when,vol){
    vol=vol||0.08;
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0,when);
    g.gain.linearRampToValueAtTime(vol,when+0.005);
    g.gain.exponentialRampToValueAtTime(0.001,when+0.9);
    o.connect(g);g.connect(conv);o.start(when);o.stop(when+1.0);
  }

  // コード進行: C→G→Am→F (王道明るいポップ) × 4周
  // 各コードのアルペジオ音（高音域）
  var progression=[
    {bass:130.8, chord:[261.6,329.6,392.0], arp:[523.2,659.3,784.0,1046.5]},  // C
    {bass:196.0, chord:[246.9,293.7,392.0], arp:[392.0,493.9,587.3,784.0]},   // G
    {bass:220.0, chord:[261.6,329.6,440.0], arp:[440.0,523.2,659.3,880.0]},   // Am
    {bass:174.6, chord:[261.6,349.2,440.0], arp:[349.2,523.2,698.5,880.0]}    // F
  ];

  for(var rep=0;rep<4;rep++){
    progression.forEach(function(p,pi){
      var bt=t + (rep*4+pi)*s*4;

      // ベース（2拍ごと）
      [0, s*2].forEach(function(off){
        piano(p.bass, bt+off, s*1.8, 0.22);
      });

      // コード（1拍目と3拍目）
      [0, s*2].forEach(function(off){
        p.chord.forEach(function(f,fi){
          piano(f, bt+off+fi*0.018, s*1.6, 0.10);
        });
      });

      // キラキラアルペジオ（8分音符でキラキラ上昇）
      p.arp.forEach(function(f,ai){
        bell(f, bt + ai*s*0.5, 0.07);
        // 2拍目にも
        bell(f, bt + s*2 + ai*s*0.5, 0.05);
      });
    });
  }

  // フェードアウト
  var totalBars=16,endT=t+totalBars*s*4;
  master.gain.setValueAtTime(0.15,endT-2);
  master.gain.linearRampToValueAtTime(0,endT+1);
}

function playSelect(){
  if(!ctx)ctx=new AC();var t=ctx.currentTime;
  // ポコン！明るいポップ音（ピッチ上昇）
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(440,t);
  o.frequency.exponentialRampToValueAtTime(880,t+0.08);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.22,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.2);
  // 少し遅れてもう一粒（キラッ）
  var o2=ctx.createOscillator(),g2=ctx.createGain();
  o2.type='sine';o2.frequency.value=1320;
  g2.gain.setValueAtTime(0,t+0.07);
  g2.gain.linearRampToValueAtTime(0.09,t+0.08);
  g2.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o2.connect(g2);g2.connect(ctx.destination);o2.start(t+0.07);o2.stop(t+0.22);
}
function playClose(){
  if(!ctx)return;var t=ctx.currentTime;
  // ポコン↓（ピッチ下降）
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(660,t);
  o.frequency.exponentialRampToValueAtTime(330,t+0.12);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(0.18,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.2);
}

// =============================================================
// Claude Code のキャラクター（画面左上）
//   右へ歩く → 端で立ち止まって手足をちょこちょこ動かし、振り向く → 左へ戻る … を繰り返す
// =============================================================
(function ccMascot() {
  const svg = document.querySelector('.cc-mascot svg');
  if (!svg) return;
  const body = svg.querySelector('.cc-hop');
  const armL = svg.querySelector('.cc-arm-l');
  const armR = svg.querySelector('.cc-arm-r');
  const legs = Array.from(svg.querySelectorAll('.cc-leg')); // 左から順に4本

  const HALF = 12;        // 真ん中から左右それぞれに歩く幅（px）
  const STEP = 2;         // 1歩で進む距離（px）
  const TICK = 220;       // 1コマの長さ（ミリ秒）
  const IDLE_TICKS = 9;   // 端で立ち止まるコマ数

  let x = -HALF, dir = 1, mode = 'idle', t = 0;

  const legUp = (i, up) => legs[i].setAttribute('height', up ? 1 : 2);
  const armUp = (el, up) => el.setAttribute('y', up ? 1 : 2);
  const bob = up => body.setAttribute('transform', up ? 'translate(0,-1)' : '');
  const rest = () => { legs.forEach((_, i) => legUp(i, false)); armUp(armL, false); armUp(armR, false); bob(false); };
  const draw = () => { svg.style.transform = `translateX(${x}px) scaleX(${dir})`; };

  function tick() {
    t++;
    if (mode === 'walk') {
      // 歩く：外側2本と内側2本の足を交互に上げ、体も小さく弾ませる
      const ph = t % 2;
      armUp(armL, false); armUp(armR, false);
      legUp(0, ph === 0); legUp(2, ph === 0);
      legUp(1, ph === 1); legUp(3, ph === 1);
      bob(ph === 0);
      x += STEP * dir;
      if (x <= -HALF || x >= HALF) {
        x = Math.max(-HALF, Math.min(HALF, x));
        mode = 'idle'; t = 0; rest();
      }
    } else {
      // 立ち止まり：両腕を交互に上げ下げし、端の足でトントンと足踏み
      const ph = t % 4;
      armUp(armL, ph === 1);
      armUp(armR, ph === 3);
      legUp(0, ph === 2);
      legUp(3, ph === 0);
      bob(false);
      if (t === Math.floor(IDLE_TICKS / 2)) dir = (x >= HALF) ? -1 : 1; // 途中で振り向く
      if (t >= IDLE_TICKS) { mode = 'walk'; t = 0; rest(); }
    }
    draw();
  }

  draw();
  setInterval(tick, TICK);
})();

// ホーム画面アイコン：元のアイコン（SVG）の左上に Claude Code のキャラクターを描き足して PNG にする
(function ccIcon() {
  const appleIcon = document.getElementById('appleIcon');
  if (!appleIcon) return;
  const img = new Image();
  img.onload = function() {
    const S = 512;
    const canvas = document.createElement('canvas');
    canvas.width = S; canvas.height = S;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, S, S);
    var p=5, ox=32, oy=32;   // 1ドットの大きさと左上の位置（512pxアイコン・ハートと重ならない位置）
    var px=function(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(ox+x*p,oy+y*p,w*p,h*p);};
    var o='#d97757';
    px(2,0,8,6,o); px(0,2,2,2,o); px(10,2,2,2,o);               // 体と両腕
    px(2,6,1,2,o); px(4,6,1,2,o); px(7,6,1,2,o); px(9,6,1,2,o); // 足4本
    px(3,1,1,1,'#1a1612'); px(8,1,1,1,'#1a1612');               // 目
    try { appleIcon.href = canvas.toDataURL('image/png'); } catch (e) {}
  };
  img.src = appleIcon.href;
})();
